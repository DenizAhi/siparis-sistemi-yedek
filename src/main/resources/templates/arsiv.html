<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Arşivlenmiş Ürünler - NovaMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-secondary fw-bold"><i class="bi bi-archive"></i> Arşivlenmiş Ürünler</h2>
        <a th:href="@{/urunler}" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i> Ana Sayfaya Dön</a>
    </div>

    <div th:if="${#lists.isEmpty(urunler)}" class="alert alert-secondary text-center shadow-sm">
        <i class="bi bi-info-circle fs-4 d-block mb-2"></i>
        Arşivde silinmiş (pasif) hiçbir ürün bulunmuyor.
    </div>

    <div class="row">
        <div class="col-md-4" th:each="urun : ${urunler}">
            <div class="card mb-4 shadow-sm border-secondary opacity-75">
                <div class="card-body text-center mt-3">
                    <h5 class="card-title text-secondary fw-bold" th:text="${urun.urunAdi}">Ürün</h5>
                    <h4 class="card-text text-muted mb-3" th:text="${urun.fiyat} + ' ₺'">Fiyat</h4>
                    <p class="text-muted mb-3"><i class="bi bi-tag"></i> <span th:text="${urun.kategori}">Kategori</span></p>
                    
                    <!-- Geri Yükle Butonu -->
                    <form th:action="@{/urun/kurtar/{id}(id=${urun.id})}" method="post">
                        <button type="submit" class="btn btn-success w-100"><i class="bi bi-arrow-counterclockwise"></i> <span th:text="#{card.restore}">Geri Yükle</span></button>
                    </form>
                </div>
            </div> 
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
