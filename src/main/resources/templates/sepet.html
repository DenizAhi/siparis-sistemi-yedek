<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Sistemi - Sepetim</title>
    <!-- Bootstrap ve İkonlar -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-cart-check"></i> Sepetim</h2>
        <a th:href="@{/urunler}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Alışverişe Dön
        </a>
    </div>

    <!-- Eğer Sepet Boşsa Uyarı Göster -->
    <div th:if="${#lists.isEmpty(sepetUrunleri)}" class="alert alert-warning text-center shadow-sm">
        Sepetinizde henüz hiç ürün bulunmamaktadır.
    </div>

    <!-- Eğer Sepet Doluysa Ürünleri Listele -->
    <div th:unless="${#lists.isEmpty(sepetUrunleri)}" class="row">
        <div class="col-md-8">
            <div class="card shadow-sm mb-4">
                <div class="card-body">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Ürün Adı</th>
                                <th>Fiyat</th>
                                <th>Adet</th>
                                <th>Ara Toplam</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Veritabanından gelen sepet ürünlerini döngüye sokuyoruz -->
                            <tr th:each="item : ${sepetUrunleri}">
                                <td class="fw-bold text-primary" th:text="${item.urun.urunAdi}">Ürün Adı</td>
                                <td th:text="${item.urun.fiyat} + ' ₺'">0 ₺</td>
                                <td th:text="${item.miktar}">1</td>
                                <td th:text="${item.urun.fiyat * item.miktar} + ' ₺'">0 ₺</td>
                            </tr>
                        </tbody>
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>Ürün Adı</th>
                                <th>Fiyat</th>
                                <th class="text-center">Adet</th>
                                <th>Ara Toplam</th>
                                <th>İşlem</th> <!-- Çöp kutusu için yeni başlık -->
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="item : ${sepetUrunleri}">
                                <td class="fw-bold text-primary" th:text="${item.urun.urunAdi}">Ürün Adı</td>
                                <td th:text="${item.urun.fiyat} + ' ₺'">0 ₺</td>
                                
                                <!-- Arttırma/Azaltma Butonlarının Olduğu Hücre -->
                                <td>
                                    <div class="d-flex justify-content-center align-items-center gap-2">
                                        <!-- Azaltma Butonu -->
                                        <form th:action="@{/sepet/azalt}" method="post" class="m-0">
                                            <input type="hidden" name="sepetItemId" th:value="${item.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary fw-bold">-</button>
                                        </form>
                                        
                                        <!-- Miktar -->
                                        <span class="fw-bold fs-5" th:text="${item.miktar}">1</span>
                                        
                                        <!-- Arttırma Butonu -->
                                        <form th:action="@{/sepet/arttir}" method="post" class="m-0">
                                            <input type="hidden" name="sepetItemId" th:value="${item.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-secondary fw-bold">+</button>
                                        </form>
                                    </div>
                                </td>
                                
                                <td class="fw-bold text-success" th:text="${item.urun.fiyat * item.miktar} + ' ₺'">0 ₺</td>
                                
                                <!-- Çöp Kutusu (Silme) Hücresi -->
                                <td>
                                    <form th:action="@{/sepet/sil}" method="post" class="m-0">
                                        <input type="hidden" name="sepetItemId" th:value="${item.id}">
                                        <button type="submit" class="btn btn-sm btn-danger shadow-sm">
                                            <i class="bi bi-trash3-fill"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Sipariş Özeti ve Toplam Tutar Kısmı -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Sipariş Özeti</h5>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between mb-3">
                        <span>Toplam Tutar:</span>
                        <strong class="text-success fs-5" th:text="${toplamTutar} + ' ₺'">0 ₺</strong>
                    </div>
                    <form th:action="@{/siparis/tamamla}" method="post">
                        <button type="submit" class="btn btn-success w-100 shadow-sm">
                            <i class="bi bi-credit-card"></i> Alışverişi Tamamla
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
