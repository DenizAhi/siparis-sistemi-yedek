<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sipariş Sistemi - Kayıt Ol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex justify-content-center align-items-center" style="height: 100vh;">

    <div class="card shadow-sm p-4" style="width: 350px;">
        <h3 class="text-center mb-4">Yeni Kayıt</h3>
        
        <form th:action="@{/kayit}" method="post">
            <div class="mb-3">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Şifre</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100">Kayıt Ol</button>
        </form>
        
        <div class="mt-3 text-center">
            <a th:href="@{/login}">Zaten hesabın var mı? Giriş Yap</a>
        </div>
    </div>

</body>
</html>
