<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{product.edit.title}">Ürün Düzenle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="card-title text-center mb-4" th:text="#{product.edit.title}">Ürün Düzenle</h3>
                        
                        <form th:action="@{/urun/duzenle/{id}(id=${urun.id})}" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.edit.name}">Ürün Adı</label>
                                <input type="text" name="urunAdi" class="form-control" th:value="${urun.urunAdi}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.edit.category}">Kategori</label>
                                <select name="kategori" class="form-select" required>
                                    <!-- Veritabanı bütünlüğü için "value" kısmı Türkçe kalır, sadece "th:text" ile gösterilen metin çevrilir -->
                                    <option value="Teknoloji" th:selected="${urun.kategori == 'Teknoloji'}" th:text="#{category.technology}">Teknoloji</option>
                                    <option value="Giyim" th:selected="${urun.kategori == 'Giyim'}" th:text="#{category.clothing}">Giyim</option>
                                    <option value="Ev Eşyaları" th:selected="${urun.kategori == 'Ev Eşyaları'}" th:text="#{category.home}">Ev Eşyaları</option>
                                    <option value="Diğer" th:selected="${urun.kategori == 'Diğer'}" th:text="#{category.other}">Diğer</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" th:text="#{product.edit.price}">Fiyat (₺)</label>
                                <input type="number" step="0.01" name="fiyat" class="form-control" th:value="${urun.fiyat}" required>
                            </div>

                            <div class="mb-4">
                                <label class="form-label" th:text="#{product.edit.stock}">Stok Adedi</label>
                                <input type="number" name="stokAdedi" class="form-control" th:value="${urun.stokAdedi}" required>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary" th:text="#{product.edit.save}">Değişiklikleri Kaydet</button>
                                <a th:href="@{/urun/detay/{id}(id=${urun.id})}" class="btn btn-outline-secondary" th:text="#{product.edit.cancel}">İptal</a>
                            </div>
                        </form>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
