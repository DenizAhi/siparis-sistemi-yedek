<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Yeni Ürün Ekle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white text-center">
                    <h4><i class="bi bi-plus-circle"></i> Yeni Ürün Ekle</h4>
                </div>
                <div class="card-body">
                    <!-- Form verileri POST metodu ile Controller'a gönderilecek -->
                    <form th:action="@{/urun/ekle}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Ürün Adı</label>
                            <input type="text" class="form-control" name="urunAdi" placeholder="Örn: Kablosuz Kulaklık" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Ürün Fiyatı (₺)</label>
                            <input type="number" step="0.01" class="form-control" name="fiyat" placeholder="Örn: 1500.50" required />
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stok Adedi</label>
                            <input type="number" class="form-control" name="stokAdedi" placeholder="Örn: 50" required />
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Kategori</label>
                            <select class="form-select" name="kategori" required>
                                <option value="" disabled selected>Kategori Seçiniz...</option>
                                <option value="Teknoloji">Teknoloji</option>
                                <option value="Ev Eşyaları">Ev Eşyaları</option>
                                <option value="Giyim">Giyim</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-success w-100">Sisteme Ekle</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a th:href="@{/urunler}" class="btn btn-secondary btn-sm">Vazgeç ve Geri Dön</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
