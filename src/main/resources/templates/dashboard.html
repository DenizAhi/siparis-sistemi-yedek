<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{dashboard.title}">Yönetici Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4" th:text="#{dashboard.title}">Yönetim Paneli İstatistikleri</h2>
        
        <a th:href="@{/urunler}" class="btn btn-secondary mb-4" th:text="'&larr; ' + #{dashboard.back}">&larr; Ana Sayfaya Dön</a>

        <div class="row mb-5">
            <div class="col-md-3">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title" th:text="#{dashboard.total_orders}">Toplam Sipariş</h5>
                        <h2 class="card-text" th:text="${toplamSiparis}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title" th:text="#{dashboard.total_revenue}">Toplam Ciro</h5>
                        <h2 class="card-text"><span th:text="${toplamCiro}">0</span> ₺</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-warning mb-3">
                    <div class="card-body">
                        <h5 class="card-title" th:text="#{dashboard.total_products}">Kayıtlı Ürün</h5>
                        <h2 class="card-text" th:text="${toplamUrun}">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card text-white bg-danger mb-3">
                    <div class="card-body">
                        <h5 class="card-title" th:text="#{dashboard.total_users}">Kayıtlı Kullanıcı</h5>
                        <h2 class="card-text" th:text="${toplamKullanici}">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title mb-4" th:text="#{dashboard.chart_title}">Son 7 Günün Satış Performansı</h5>
                <canvas id="satisGrafigi" height="100"></canvas>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const etiketler = /*[[${grafikTarihler}]]*/ [];
        const veriler = /*[[${grafikTutarlar}]]*/ [];

        const ctx = document.getElementById('satisGrafigi').getContext('2d');
        const satisGrafigi = new Chart(ctx, {
            type: 'line', 
            data: {
                labels: etiketler,
                datasets: [{
                    label: 'Ciro / Revenue',
                    data: veriler,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 3,
                    tension: 0.3, 
                    fill: true
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
