# ==========================================
# MASTER (Yazma İşlemleri İçin) - Port 5433
# ==========================================
spring.datasource.master.jdbc-url=jdbc:postgresql://localhost:5433/siparis_sistemi_db
spring.datasource.master.username=postgres
spring.datasource.master.password=1234
spring.datasource.master.driver-class-name=org.postgresql.Driver

# ==========================================
# REPLICA (Okuma İşlemleri İçin) - Port 5434
# ==========================================
spring.datasource.replica.jdbc-url=jdbc:postgresql://localhost:5434/siparis_sistemi_db
spring.datasource.replica.username=postgres
spring.datasource.replica.password=1234
spring.datasource.replica.driver-class-name=org.postgresql.Driver

# Hibernate Ayarları
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true